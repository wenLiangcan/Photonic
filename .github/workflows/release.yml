name: Release DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26-intel

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Validate tag and source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a semantic version: $version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run isolated interaction regression tests
        run: bash scripts/test.sh

      - name: Build Apple silicon DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SWIFT_BUILD_FLAGS: --arch arm64
        run: scripts/create-dmg.sh

      - name: Verify bundle and disk image versions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw .build/Photonic.app/Contents/Info.plist)"
          test "$bundle_version" = "$version"
          test -f "dist/Photonic-$version.dmg"
          test -f "dist/Photonic-$version.dmg.sha256"
          test "$(lipo -archs .build/Photonic.app/Contents/MacOS/Photonic)" = "arm64"
          (cd dist && shasum -a 256 -c "Photonic-$version.dmg.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Photonic-$version.dmg" \
            "dist/Photonic-$version.dmg.sha256" \
            --verify-tag \
            --title "Photonic $version" \
            --generate-notes

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: wenLiangcan/homebrew-photonic
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          checksum="$(awk '{print $1}' "dist/Photonic-$version.dmg.sha256")"
          cask="homebrew-tap/Casks/photonic.rb"

          ruby -e '
            path, version, checksum = ARGV
            contents = File.read(path)
            contents.sub!(/^  version ".*"$/, "  version \"#{version}\"") or abort "version field not found"
            contents.sub!(/^  sha256 ".*"$/, "  sha256 \"#{checksum}\"") or abort "sha256 field not found"
            File.write(path, contents)
          ' "$cask" "$version" "$checksum"

          cd homebrew-tap
          if git diff --quiet -- Casks/photonic.rb; then
            echo "Homebrew cask already points to Photonic $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/photonic.rb
          git commit -m "Update Photonic cask to $version"
          git push
