name: Release DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Select Swift 6.2
        uses: swift-actions/setup-swift@65540b95f51493d65f5e59e97dcef9629ddf11bf
        with:
          swift-version: "6.2"

      - name: Validate tag and source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a semantic version: $version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SWIFT_BUILD_FLAGS: --arch arm64 --arch x86_64
        run: scripts/create-dmg.sh

      - name: Verify bundle and disk image versions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw .build/Photonic.app/Contents/Info.plist)"
          test "$bundle_version" = "$version"
          test -f "dist/Photonic-$version.dmg"
          test -f "dist/Photonic-$version.dmg.sha256"
          lipo -verify_arch arm64 x86_64 .build/Photonic.app/Contents/MacOS/Photonic

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Photonic-$version.dmg" \
            "dist/Photonic-$version.dmg.sha256" \
            --verify-tag \
            --title "Photonic $version" \
            --generate-notes
